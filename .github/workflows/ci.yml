name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Ruby example generates cleanly
        run: node packages/cli/dist/index.js generate examples/ruby
      - name: Azure Grove example generates cleanly
        run: node packages/cli/dist/index.js generate examples/azuregrove

  # Compiles each example mod against real Minecraft 26.3 and Fabric API, so a
  # template change that produces broken Java or resources fails here, not on a player's PC.
  gradle:
    name: gradle build (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [ruby, azuregrove]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build the Floration CLI
        run: npm run build -w @modcreator/core -w @modcreator/cli
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: gradlew build
        working-directory: examples/${{ matrix.example }}
        run: ./gradlew build --no-daemon --stacktrace
      # Loom has now downloaded the game jar and its libraries, so check the mob models and goals the
      # editor offers still match what that jar has.
      - name: Vanilla mob data matches the jar
        if: matrix.example == 'azuregrove'
        run: node scripts/extract-vanilla.mjs --check
      - name: Jar metadata matches modcreator.json
        working-directory: examples/${{ matrix.example }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          unzip -p "$jar" fabric.mod.json > "$RUNNER_TEMP/fabric.mod.json"
          node -e '
            const fs = require("fs");
            const project = JSON.parse(fs.readFileSync("modcreator.json", "utf8"));
            const mod = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (mod.version !== project.version) throw new Error(`jar version ${mod.version}, modcreator.json ${project.version}`);
            for (const d of project.dependencies ?? []) {
              if (d.required !== false && !(d.slug in mod.depends)) throw new Error(`jar does not depend on ${d.slug}`);
            }
          ' "$RUNNER_TEMP/fabric.mod.json"
      - name: Dev server loads the mod's data
        working-directory: examples/${{ matrix.example }}
        run: ../../.github/scripts/boot-server.sh
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-jar
          path: examples/${{ matrix.example }}/build/libs/*.jar
          if-no-files-found: error
