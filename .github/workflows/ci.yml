name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Ruby example generates cleanly
        run: node packages/cli/dist/index.js generate examples/ruby
      - name: Azure Grove example generates cleanly
        run: node packages/cli/dist/index.js generate examples/azuregrove
